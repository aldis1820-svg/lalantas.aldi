<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic City Lights 3D - Fixed Yellow Light & Signal Config</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #060919;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      padding: 15px 25px;
      border-radius: 16px;
      pointer-events: auto;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
    }
    .hud-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.2);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      transform: translateY(-2px);
    }
    .btn-primary {
      background: #0284c7;
      border-color: #0284c7;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0369a1;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.6);
    }
    .hud-bottom {
      display: flex;
      gap: 15px;
      pointer-events: auto;
      flex-wrap: wrap;
    }
    .status-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      padding: 12px 16px;
      border-radius: 12px;
      min-width: 150px;
      text-align: center;
    }
    .status-title {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
    }
    .status-val {
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
    }
    .light-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .light-red { background: #ef4444; box-shadow: 0 0 14px #ef4444; }
    .light-yellow { background: #f59e0b; box-shadow: 0 0 14px #f59e0b; }
    .light-green { background: #10b981; box-shadow: 0 0 14px #10b981; }

    .config-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 12px 18px;
      border-radius: 12px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .config-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .config-label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .config-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .config-input input[type=range] {
      accent-color: #38bdf8;
      cursor: pointer;
      width: 90px;
    }
    .config-val-badge {
      font-size: 13px;
      font-weight: 700;
      color: #00f0ff;
      min-width: 25px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <div class="hud-layer">
    <div class="hud-header">
      <div class="brand-title">REALISTIC CITY LIGHTS 3D</div>
      <div class="hud-controls">
        <button class="btn" id="btn-cam">KAMERA: DRONE AUTO</button>
        <button class="btn btn-primary" id="btn-mode">LALU LINTAS: OTOMATIS</button>
      </div>
    </div>
    
    <div class="hud-bottom">
      <div class="status-card">
        <div class="status-title">UTARA - SELATAN</div>
        <div class="status-val" id="timer-ns">
          <span class="light-indicator light-green" id="ind-ns"></span><span id="val-ns">15s (GREEN)</span>
        </div>
      </div>
      <div class="status-card">
        <div class="status-title">TIMUR - BARAT</div>
        <div class="status-val" id="timer-ew">
          <span class="light-indicator light-red" id="ind-ew"></span><span id="val-ew">18s (RED)</span>
        </div>
      </div>
      
      <!-- SIGNAL TIMER CONFIG PANEL -->
      <div class="config-card">
        <div class="config-group">
          <div class="config-label">CONFIG TIMER N/S</div>
          <div class="config-input">
            <input type="range" id="input-ns" min="10" max="60" value="15">
            <span class="config-val-badge" id="badge-ns">15s</span>
          </div>
        </div>
        <div class="config-group">
          <div class="config-label">CONFIG TIMER E/W</div>
          <div class="config-input">
            <input type="range" id="input-ew" min="10" max="60" value="15">
            <span class="config-val-badge" id="badge-ew">15s</span>
          </div>
        </div>
        <button class="btn btn-primary" id="btn-apply-timer" style="padding: 6px 12px; font-size: 11px;">RESET TIMER</button>
      </div>

      <div class="status-card">
        <div class="status-title">TOTAL KENDARAAN</div>
        <div class="status-val" id="car-count">0</div>
      </div>
    </div>
  </div>

  <script>
    // --- SCENE SETUP (REALISTIC NIGHT CITYLIGHTS) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060919); 
    scene.fog = new THREE.FogExp2(0x060919, 0.0035);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(70, 55, 70);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02;

    // --- ENHANCED ATMOSPHERIC CITYLIGHTING ---
    const ambientLight = new THREE.AmbientLight(0x1e293b, 1.2);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x38bdf8, 0.8);
    moonLight.position.set(80, 140, 50);
    moonLight.castShadow = true;
    scene.add(moonLight);

    const skyGlow = new THREE.DirectionalLight(0x818cf8, 0.5);
    skyGlow.position.set(-80, 60, -50);
    scene.add(skyGlow);

    const centerPointLight = new THREE.PointLight(0x38bdf8, 2.5, 90);
    centerPointLight.position.set(0, 15, 0);
    scene.add(centerPointLight);

    // --- REALISTIC ENVIRONMENT: ROADS, SIDEWALKS & GREENERY ---
    const groundGeo = new THREE.PlaneGeometry(300, 300);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x070b19, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const roadWidth = 14;
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.2 });
    
    const nsRoad = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, 300), roadMat);
    nsRoad.rotation.x = -Math.PI / 2;
    nsRoad.position.y = 0.01;
    nsRoad.receiveShadow = true;
    scene.add(nsRoad);

    const ewRoad = new THREE.Mesh(new THREE.PlaneGeometry(300, roadWidth), roadMat);
    ewRoad.rotation.x = -Math.PI / 2;
    ewRoad.position.y = 0.01;
    ewRoad.receiveShadow = true;
    scene.add(ewRoad);

    function createSidewalks() {
      const swMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
      const swWidth = 5;
      const swHeight = 0.3;

      const quadrants = [
        { x: -16 - swWidth/2, z: -16 - swWidth/2 },
        { x: 16 + swWidth/2, z: -16 - swWidth/2 },
        { x: -16 - swWidth/2, z: 16 + swWidth/2 },
        { x: 16 + swWidth/2, z: 16 + swWidth/2 }
      ];

      quadrants.forEach(q => {
        const swMesh = new THREE.Mesh(new THREE.BoxGeometry(100, swHeight, 100), swMat);
        swMesh.position.set(q.x < 0 ? q.x - 45 : q.x + 45, swHeight / 2, q.z < 0 ? q.z - 45 : q.z + 45);
        swMesh.receiveShadow = true;
        scene.add(swMesh);
      });
    }
    createSidewalks();

    function createRoadMarkings() {
      const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xfcb316 });

      for (let i = -140; i <= 140; i += 12) {
        if (Math.abs(i) < 18) continue;

        const nsLine = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 6), yellowLineMat);
        nsLine.rotation.x = -Math.PI / 2;
        nsLine.position.set(0, 0.02, i);
        scene.add(nsLine);

        const ewLine = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.3), yellowLineMat);
        ewLine.rotation.x = -Math.PI / 2;
        ewLine.position.set(i, 0.02, 0);
        scene.add(ewLine);
      }

      for (let offset = -5; offset <= 5; offset += 1.8) {
        const zN = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 3.5), lineMat);
        zN.rotation.x = -Math.PI / 2;
        zN.position.set(offset, 0.03, -11);
        scene.add(zN);

        const zS = zN.clone(); zS.position.set(offset, 0.03, 11); scene.add(zS);

        const zE = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.0), lineMat);
        zE.rotation.x = -Math.PI / 2;
        zE.position.set(11, 0.03, offset);
        scene.add(zE);

        const zW = zE.clone(); zW.position.set(-11, 0.03, offset); scene.add(zW);
      }
    }
    createRoadMarkings();

    function createVegetation() {
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3f2e1e, roughness: 0.9 });
      const leavesMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.4 });
      const bushMat = new THREE.MeshStandardMaterial({ color: 0x059669, roughness: 0.5 });

      const plantPositions = [
        { x: -8.5, z: -30 }, { x: -8.5, z: -60 }, { x: -8.5, z: -90 },
        { x: 8.5, z: -30 }, { x: 8.5, z: -60 }, { x: 8.5, z: -90 },
        { x: -8.5, z: 30 }, { x: -8.5, z: 60 }, { x: -8.5, z: 90 },
        { x: 8.5, z: 30 }, { x: 8.5, z: 60 }, { x: 8.5, z: 90 },
        { x: -30, z: -8.5 }, { x: -60, z: -8.5 }, { x: -90, z: -8.5 },
        { x: -30, z: 8.5 }, { x: -60, z: 8.5 }, { x: -90, z: 8.5 },
        { x: 30, z: -8.5 }, { x: 60, z: -8.5 }, { x: 90, z: -8.5 },
        { x: 30, z: 8.5 }, { x: 60, z: 8.5 }, { x: 90, z: 8.5 }
      ];

      plantPositions.forEach(p => {
        const treeGroup = new THREE.Group();

        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 4), trunkMat);
        trunk.position.y = 2;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        const leaves = new THREE.Mesh(new THREE.SphereGeometry(2.4, 8, 8), leavesMat);
        leaves.position.y = 4.8;
        leaves.castShadow = true;
        treeGroup.add(leaves);

        const bush = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8), bushMat);
        bush.position.set(0.6, 0.4, 0.4);
        treeGroup.add(bush);

        treeGroup.position.set(p.x, 0.3, p.z);
        scene.add(treeGroup);
      });
    }
    createVegetation();

    // --- REALISTIC CITY LIGHTS BUILDING GENERATOR ---
    function generateWindowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, 128, 256);

      const colors = ['#fef08a', '#e0f2fe', '#bae6fd', '#fef3c7', '#38bdf8'];
      
      for (let y = 10; y < 240; y += 20) {
        for (let x = 10; x < 110; x += 18) {
          if (Math.random() > 0.3) {
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.fillRect(x, y, 10, 12);
          } else {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(x, y, 10, 12);
          }
        }
      }
      return new THREE.CanvasTexture(canvas);
    }

    const windowTex = generateWindowTexture();
    windowTex.wrapS = THREE.RepeatWrapping;
    windowTex.wrapT = THREE.RepeatWrapping;
    windowTex.repeat.set(2, 4);

    function createCity() {
      const bColors = [0x0f172a, 0x1e1b4b, 0x1e293b, 0x090d16];
      const windowLightColors = [0xfef08a, 0x38bdf8, 0x818cf8, 0xf43f5e];

      for (let x = -110; x <= 110; x += 32) {
        for (let z = -110; z <= 110; z += 32) {
          if (Math.abs(x) < 22 || Math.abs(z) < 22) continue;

          const h = 25 + Math.random() * 50;
          const w = 20 + Math.random() * 4;
          const d = 20 + Math.random() * 4;

          const bMat = new THREE.MeshStandardMaterial({
            color: bColors[Math.floor(Math.random() * bColors.length)],
            roughness: 0.2,
            metalness: 0.75
          });
          const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat);
          bMesh.position.set(x, h / 2, z);
          bMesh.castShadow = true;
          scene.add(bMesh);

          const winMat = new THREE.MeshStandardMaterial({
            map: windowTex,
            emissiveMap: windowTex,
            emissive: 0xffffff,
            emissiveIntensity: 0.85,
            roughness: 0.1,
            metalness: 0.9
          });
          const winMesh = new THREE.Mesh(new THREE.BoxGeometry(w * 0.96, h * 0.92, d * 0.96), winMat);
          winMesh.position.set(x, h / 2, z);
          scene.add(winMesh);

          const lightColor = windowLightColors[Math.floor(Math.random() * windowLightColors.length)];
          const roofTrimMat = new THREE.MeshBasicMaterial({ color: lightColor });
          const roofTrim = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.6, d + 0.5), roofTrimMat);
          roofTrim.position.set(x, h + 0.3, z);
          scene.add(roofTrim);

          if (h > 45) {
            const beaconMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), beaconMat);
            beacon.position.set(x, h + 1.2, z);
            scene.add(beacon);
          }

          if (Math.random() > 0.35) {
            const buildingGlow = new THREE.PointLight(lightColor, 1.8, 45);
            buildingGlow.position.set(x, h * 0.6, z);
            scene.add(buildingGlow);
          }
        }
      }
    }
    createCity();

    // --- TRAFFIC LIGHT SYSTEM & SIGNAL TIMER CONFIG ---
    let stateNS = 'GREEN';
    let stateEW = 'RED';

    let configDurationNS = 15;
    let configDurationEW = 15;

    let timerNS = configDurationNS;
    let timerEW = configDurationNS + 3;

    const inputNS = document.getElementById('input-ns');
    const inputEW = document.getElementById('input-ew');
    const badgeNS = document.getElementById('badge-ns');
    const badgeEW = document.getElementById('badge-ew');
    const btnApply = document.getElementById('btn-apply-timer');

    inputNS.addEventListener('input', (e) => {
      configDurationNS = parseInt(e.target.value);
      badgeNS.innerText = `${configDurationNS}s`;
    });

    inputEW.addEventListener('input', (e) => {
      configDurationEW = parseInt(e.target.value);
      badgeEW.innerText = `${configDurationEW}s`;
    });

    btnApply.addEventListener('click', () => {
      if (stateNS === 'GREEN') {
        timerNS = configDurationNS;
        timerEW = configDurationNS + 3;
      } else if (stateEW === 'GREEN') {
        timerEW = configDurationEW;
        timerNS = configDurationEW + 3;
      }
      updateLightsVisual();
    });

    const lights3D = {};
    function createTrafficLight(name, x, z, rotY) {
      const group = new THREE.Group();
      
      const poleMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8 });
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 8), poleMat);
      pole.position.y = 4;
      pole.castShadow = true;
      group.add(pole);

      const boxMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.4, 1.4), boxMat);
      box.position.y = 7;
      group.add(box);

      const rGeo = new THREE.SphereGeometry(0.38, 16, 16);
      const rMesh = new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({ color: 0x330000 }));
      const yMesh = new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({ color: 0x333300 }));
      const gMesh = new THREE.Mesh(rGeo, new THREE.MeshBasicMaterial({ color: 0x003300 }));

      rMesh.position.set(0, 7.9, 0.7);
      yMesh.position.set(0, 7.0, 0.7);
      gMesh.position.set(0, 6.1, 0.7);

      group.add(rMesh, yMesh, gMesh);

      const lightGlow = new THREE.PointLight(0x10b981, 2.5, 25);
      lightGlow.position.set(0, 7, 1);
      group.add(lightGlow);

      group.position.set(x, 0, z);
      group.rotation.y = rotY;
      scene.add(group);

      lights3D[name] = { red: rMesh, yellow: yMesh, green: gMesh, glow: lightGlow };
    }

    createTrafficLight('N', -9, -9, 0);
    createTrafficLight('S', 9, 9, Math.PI);
    createTrafficLight('E', 9, -9, Math.PI / 2);
    createTrafficLight('W', -9, 9, -Math.PI / 2);

    // FIX LOGIK KUNING: Memastikan warna kuning menyala terang saat fase 'YELLOW'
    function updateLightsVisual() {
      const setMat = (lightObj, activeColor) => {
        lightObj.red.material.color.setHex(activeColor === 'RED' ? 0xef4444 : 0x330000);
        lightObj.yellow.material.color.setHex(activeColor === 'YELLOW' ? 0xffcc00 : 0x333300);
        lightObj.green.material.color.setHex(activeColor === 'GREEN' ? 0x10b981 : 0x003300);
        
        let hexGlow = 0x10b981;
        if (activeColor === 'RED') hexGlow = 0xef4444;
        if (activeColor === 'YELLOW') hexGlow = 0xffcc00;
        lightObj.glow.color.setHex(hexGlow);
      };

      setMat(lights3D['N'], stateNS);
      setMat(lights3D['S'], stateNS);
      setMat(lights3D['E'], stateEW);
      setMat(lights3D['W'], stateEW);

      document.getElementById('ind-ns').className = `light-indicator light-${stateNS.toLowerCase()}`;
      document.getElementById('ind-ew').className = `light-indicator light-${stateEW.toLowerCase()}`;
      document.getElementById('val-ns').innerText = `${timerNS}s (${stateNS})`;
      document.getElementById('val-ew').innerText = `${timerEW}s (${stateEW})`;
    }

    setInterval(() => {
      if (timerNS > 0) timerNS--;
      if (timerEW > 0) timerEW--;

      if (stateNS === 'GREEN' && timerNS === 0) {
        stateNS = 'YELLOW'; 
        timerNS = 3;
      } else if (stateNS === 'YELLOW' && timerNS === 0) {
        stateNS = 'RED'; 
        timerNS = configDurationEW + 3;
        stateEW = 'GREEN'; 
        timerEW = configDurationEW;
      }

      if (stateEW === 'GREEN' && timerEW === 0) {
        stateEW = 'YELLOW'; 
        timerEW = 3;
      } else if (stateEW === 'YELLOW' && timerEW === 0) {
        stateEW = 'RED'; 
        timerEW = configDurationNS + 3;
        stateNS = 'GREEN'; 
        timerNS = configDurationNS;
      }

      updateLightsVisual();
    }, 1000);

    // --- REALISTIC 3D VEHICLE WITH DYNAMIC HEADLIGHT SPOTLIGHTS ---
    const cars = [];
    const carMetallicColors = [0x0f172a, 0x38bdf8, 0x818cf8, 0xf59e0b, 0x10b981, 0xec4899, 0xffffff];

    function createDetailedCarMesh(colorHex) {
      const carGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({
        color: colorHex,
        metalness: 0.85,
        roughness: 0.15
      });
      const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.85 });
      const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.95, roughness: 0.05 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
      const headLampMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const tailLampMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });

      const bodyLower = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.7, 4.6), bodyMat);
      bodyLower.position.y = 0.6;
      bodyLower.castShadow = true;
      carGroup.add(bodyLower);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.7, 2.4), glassMat);
      cabin.position.set(0, 1.25, -0.2);
      carGroup.add(cabin);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.05, 2.2), bodyMat);
      roof.position.set(0, 1.62, -0.2);
      carGroup.add(roof);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.15, 1.3), bodyMat);
      hood.position.set(0, 0.95, 1.4);
      carGroup.add(hood);

      const grille = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 0.1), darkMetalMat);
      grille.position.set(0, 0.6, 2.31);
      carGroup.add(grille);

      const hl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), headLampMat);
      hl1.position.set(-0.8, 0.65, 2.31);
      const hl2 = hl1.clone();
      hl2.position.set(0.8, 0.65, 2.31);
      carGroup.add(hl1, hl2);

      const headlightSpot = new THREE.SpotLight(0xffffff, 4.0, 35, Math.PI / 6, 0.4, 1.0);
      headlightSpot.position.set(0, 0.8, 2.3);
      
      const headTarget = new THREE.Object3D();
      headTarget.position.set(0, 0, 15);
      carGroup.add(headTarget);
      headlightSpot.target = headTarget;
      carGroup.add(headlightSpot);

      const tl1 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.1), tailLampMat);
      tl1.position.set(-0.8, 0.65, -2.31);
      const tl2 = tl1.clone();
      tl2.position.set(0.8, 0.65, -2.31);
      carGroup.add(tl1, tl2);

      const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 16);
      const rimGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.32, 12);

      const wheelPositions = [
        { x: -1.15, z: 1.4 },
        { x: 1.15, z: 1.4 },
        { x: -1.15, z: -1.4 },
        { x: 1.15, z: -1.4 }
      ];

      wheelPositions.forEach(wp => {
        const wMesh = new THREE.Mesh(wheelGeo, tireMat);
        wMesh.rotation.z = Math.PI / 2;
        wMesh.position.set(wp.x, 0.45, wp.z);
        wMesh.castShadow = true;

        const rMesh = new THREE.Mesh(rimGeo, chromeMat);
        rMesh.rotation.z = Math.PI / 2;
        rMesh.position.set(wp.x, 0.45, wp.z);

        carGroup.add(wMesh, rMesh);
      });

      return carGroup;
    }

    function spawnCar(dir) {
      const color = carMetallicColors[Math.floor(Math.random() * carMetallicColors.length)];
      const carMesh = createDetailedCarMesh(color);

      let pos = { x: 0, z: 0 };
      let rot = 0;
      let stopLine = 0;

      if (dir === 'N') { pos = { x: -3.5, z: -110 }; rot = 0; stopLine = -10; }
      if (dir === 'S') { pos = { x: 3.5, z: 110 }; rot = Math.PI; stopLine = 10; }
      if (dir === 'E') { pos = { x: 110, z: -3.5 }; rot = -Math.PI / 2; stopLine = 10; }
      if (dir === 'W') { pos = { x: -110, z: 3.5 }; rot = Math.PI / 2; stopLine = -10; }

      carMesh.position.set(pos.x, 0, pos.z);
      carMesh.rotation.y = rot;
      scene.add(carMesh);

      cars.push({
        mesh: carMesh,
        dir: dir,
        speed: 0,
        maxSpeed: 0.35 + Math.random() * 0.1,
        stopLine: stopLine
      });

      document.getElementById('car-count').innerText = cars.length;
    }

    setInterval(() => {
      const dirs = ['N', 'S', 'E', 'W'];
      if (cars.length < 24) {
        spawnCar(dirs[Math.floor(Math.random() * dirs.length)]);
      }
    }, 1400);

    function updateCars() {
      const SAFE_DISTANCE = 8.5;

      cars.forEach((car, index) => {
        let targetSpeed = car.maxSpeed;
        const pos = car.mesh.position;

        let isRed = false;
        if (car.dir === 'N' && pos.z < car.stopLine && pos.z > car.stopLine - 16) isRed = (stateNS !== 'GREEN');
        if (car.dir === 'S' && pos.z > car.stopLine && pos.z < car.stopLine + 16) isRed = (stateNS !== 'GREEN');
        if (car.dir === 'E' && pos.x > car.stopLine && pos.x < car.stopLine + 16) isRed = (stateEW !== 'GREEN');
        if (car.dir === 'W' && pos.x < car.stopLine && pos.x > car.stopLine - 16) isRed = (stateEW !== 'GREEN');

        if (isRed) targetSpeed = 0;

        cars.forEach((otherCar, otherIdx) => {
          if (index === otherIdx || car.dir !== otherCar.dir) return;

          let dist = 999;
          if (car.dir === 'N' && otherCar.mesh.position.z > pos.z) dist = otherCar.mesh.position.z - pos.z;
          if (car.dir === 'S' && otherCar.mesh.position.z < pos.z) dist = pos.z - otherCar.mesh.position.z;
          if (car.dir === 'E' && otherCar.mesh.position.x < pos.x) dist = pos.x - otherCar.mesh.position.x;
          if (car.dir === 'W' && otherCar.mesh.position.x > pos.x) dist = otherCar.mesh.position.x - pos.x;

          if (dist > 0 && dist < SAFE_DISTANCE) {
            targetSpeed = Math.min(targetSpeed, (dist / SAFE_DISTANCE) * otherCar.speed);
          }
        });

        car.speed += (targetSpeed - car.speed) * 0.1;
        if (car.speed < 0.001) car.speed = 0;

        if (car.dir === 'N') pos.z += car.speed;
        if (car.dir === 'S') pos.z -= car.speed;
        if (car.dir === 'E') pos.x -= car.speed;
        if (car.dir === 'W') pos.x += car.speed;

        if (Math.abs(pos.x) > 130 || Math.abs(pos.z) > 130) {
          scene.remove(car.mesh);
          cars.splice(index, 1);
          document.getElementById('car-count').innerText = cars.length;
        }
      });
    }

    // --- ANIMATION LOOP ---
    let autoCam = true;
    let camAngle = 0;

    document.getElementById('btn-cam').addEventListener('click', () => {
      autoCam = !autoCam;
      document.getElementById('btn-cam').innerText = autoCam ? 'KAMERA: DRONE AUTO' : 'KAMERA: BEBAS ORBIT';
    });

    function animate() {
      requestAnimationFrame(animate);
      updateCars();

      if (autoCam) {
        camAngle += 0.002;
        camera.position.x = Math.sin(camAngle) * 80;
        camera.position.z = Math.cos(camAngle) * 80;
        camera.position.y = 55;
        camera.lookAt(0, 0, 0);
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
